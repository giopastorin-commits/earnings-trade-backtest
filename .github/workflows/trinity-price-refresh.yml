name: TRINITY Twelve Data Price Refresh (manual)

on:
  workflow_dispatch:
    inputs:
      target_session:
        description: Verified completed US market session (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trinity-twelvedata-price-refresh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
  TRINITY_R2_ENDPOINT: ${{ secrets.TRINITY_R2_ENDPOINT }}
  TRINITY_R2_ACCESS_KEY_ID: ${{ secrets.TRINITY_R2_ACCESS_KEY_ID }}
  TRINITY_R2_SECRET_ACCESS_KEY: ${{ secrets.TRINITY_R2_SECRET_ACCESS_KEY }}
  TRINITY_R2_BUCKET: ${{ vars.TRINITY_R2_BUCKET || 'trinity-raw' }}

jobs:
  refresh:
    name: Acquire, validate, and archive immutable OHLCV snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Initialize runner-local snapshot path
        shell: bash
        run: echo "PRICE_SNAPSHOT_ROOT=$RUNNER_TEMP/trinity-price-snapshot" >> "$GITHUB_ENV"

      - name: Check out price acquisition implementation
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Python 3.13.15
        # actions/setup-python v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-shadow.txt

      - name: Install pinned acquisition dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-shadow.txt

      - name: Validate checked-in canonical registry state
        run: >-
          python -c "from trinity.usa_issuer_registry import REGISTRY;
          assert len(REGISTRY.records) == 518 and len(REGISTRY.supported) == 518 and not REGISTRY.unsupported"

      - name: Acquire and hard-gate canonical Twelve Data OHLCV
        run: >-
          python -m trinity.shadow.price_refresh acquire
          --target-session "${{ inputs.target_session }}"
          --output-root "$PRICE_SNAPSHOT_ROOT"
          --run-id "$GITHUB_RUN_ID-A$GITHUB_RUN_ATTEMPT"

      - name: Upload immutable snapshot and verify R2 bytes and hashes
        run: >-
          python -m trinity.shadow.price_refresh archive
          --output-root "$PRICE_SNAPSHOT_ROOT"
          --run-id "$GITHUB_RUN_ID-A$GITHUB_RUN_ATTEMPT"

      - name: Preserve acquisition evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trinity-twelvedata-prices-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.PRICE_SNAPSHOT_ROOT }}
          if-no-files-found: warn
          retention-days: 30
