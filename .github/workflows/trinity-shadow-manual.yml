name: TRINITY Shadow Production (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: golden-replay
        type: choice
        options:
          - golden-replay
          - full-shadow

permissions:
  contents: read

concurrency:
  group: trinity-shadow-production-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  golden-replay:
    name: Offline Week 0 golden replay
    if: inputs.mode == 'golden-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRINITY_R2_ENDPOINT: ${{ secrets.TRINITY_R2_ENDPOINT }}
      TRINITY_R2_READ_ACCESS_KEY_ID: ${{ secrets.TRINITY_R2_READ_ACCESS_KEY_ID }}
      TRINITY_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.TRINITY_R2_READ_SECRET_ACCESS_KEY }}
      TRINITY_R2_BUCKET: ${{ vars.TRINITY_R2_BUCKET || 'trinity-raw' }}
      TRINITY_GOLDEN_BASELINE_PREFIX: ${{ vars.TRINITY_GOLDEN_BASELINE_PREFIX || 'baseline/shadow-week0/version=bfd0cc4d291439db09d9edbb7194bde235eab5cfccefdaf56bd1fd1adbf66ad2/' }}
      TRINITY_GOLDEN_BASELINE_VERSION: bfd0cc4d291439db09d9edbb7194bde235eab5cfccefdaf56bd1fd1adbf66ad2
      TRINITY_GOLDEN_BASELINE_MANIFEST_SHA256: 4109518d3c3b46036e0cbbdf21586846f2572f950d6c8b5f7297e18c07f0036a

    steps:
      - name: Initialize runner-local golden replay paths
        shell: bash
        run: |
          echo "GOLDEN_BASELINE_ROOT=$RUNNER_TEMP/trinity-golden-baseline" >> "$GITHUB_ENV"
          echo "GOLDEN_DIAGNOSTICS_ROOT=$RUNNER_TEMP/trinity-golden-diagnostics" >> "$GITHUB_ENV"
          echo "GOLDEN_OUTPUT_ROOT=$RUNNER_TEMP/trinity-golden-results/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out frozen analytical repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Python 3.13.15
        # actions/setup-python v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-golden.lock

      - name: Install hash-locked golden replay dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-golden.lock

      - name: Restore and fully verify immutable Week 0 baseline
        run: >-
          python -m trinity.shadow.golden_cloud restore
          --prefix "$TRINITY_GOLDEN_BASELINE_PREFIX"
          --manifest-sha256 "$TRINITY_GOLDEN_BASELINE_MANIFEST_SHA256"
          --baseline-root "$GOLDEN_BASELINE_ROOT"
          --diagnostics-root "$GOLDEN_DIAGNOSTICS_ROOT"

      - name: Execute offline deterministic golden replay
        run: >-
          python -m trinity.shadow.golden_cloud replay
          --baseline-root "$GOLDEN_BASELINE_ROOT"
          --reference-root tests/golden/shadow_week0
          --output-root "$GOLDEN_OUTPUT_ROOT"
          --baseline-version "$TRINITY_GOLDEN_BASELINE_VERSION"

      - name: Preserve golden comparison diagnostics
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trinity-golden-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.GOLDEN_DIAGNOSTICS_ROOT }}
            ${{ env.GOLDEN_OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

  full-shadow:
    name: Full Shadow Production
    if: inputs.mode == 'full-shadow'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TRINITY_BASELINE_PREFIX: ${{ vars.TRINITY_BASELINE_PREFIX }}
      TRINITY_R2_ENDPOINT: ${{ secrets.TRINITY_R2_ENDPOINT }}
      TRINITY_R2_ACCESS_KEY_ID: ${{ secrets.TRINITY_R2_ACCESS_KEY_ID }}
      TRINITY_R2_SECRET_ACCESS_KEY: ${{ secrets.TRINITY_R2_SECRET_ACCESS_KEY }}
      TRINITY_R2_BUCKET: ${{ vars.TRINITY_R2_BUCKET || 'trinity-raw' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      TRINITY_COST_GUARD_USD: "5.00"

    steps:
      - name: Initialize runner-local Shadow Production paths
        shell: bash
        run: |
          echo "TRINITY_DATA_ROOT=$RUNNER_TEMP/trinity-data" >> "$GITHUB_ENV"
          echo "TRINITY_BASELINE_ROOT=$RUNNER_TEMP/trinity-baseline" >> "$GITHUB_ENV"
          echo "TRINITY_RUN_ROOT=$RUNNER_TEMP/trinity-shadow" >> "$GITHUB_ENV"

      - name: Check out frozen analytical repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Python 3.13.15
        # actions/setup-python v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-shadow.txt

      - name: Install pinned Shadow runner dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-shadow.txt

      - name: Restore immutable production baseline from R2
        run: python -m trinity.shadow.cli restore

      - name: Execute frozen Shadow Production funnel
        run: python -m trinity.shadow.cli run

      - name: Archive and verify run in R2
        if: always()
        run: python -m trinity.shadow.cli archive

      - name: Preserve local diagnostics
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trinity-shadow-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.TRINITY_RUN_ROOT }}
          if-no-files-found: warn
          retention-days: 30
