name: TRINITY Official Feedback Reconciliation

# This workflow is deliberately separate from production analysis. It runs
# only after a successful production workflow. It cleanly skips runs with no
# OFFICIAL cycle; otherwise it restores the immutable archive and retries
# ingestion without rerunning Scanner/Luna/Sol.
on:
  workflow_run:
    workflows: ["TRINITY Weekly Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      official_run_id:
        description: Exact archived OFFICIAL run identity (manual retry)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trinity-official-feedback-${{ github.event.workflow_run.id || inputs.official_run_id || github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TRINITY_ANALYTICAL_REF: eb15c45b041b8890194d2f98b025aa98ed7fa527

jobs:
  reconcile:
    name: Restore archived OFFICIAL run and ingest predictions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen analytical implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TRINITY_ANALYTICAL_REF }}
          persist-credentials: false
      - name: Check out feedback registration implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .workflow-registration
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-shadow.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-shadow.txt
      - name: Ingest archived official run without rerunning analysis
        env:
          SOURCE_EVENT_NAME: ${{ github.event_name }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MANUAL_OFFICIAL_RUN_ID: ${{ inputs.official_run_id }}
          TRINITY_R2_ENDPOINT: ${{ secrets.TRINITY_R2_ENDPOINT }}
          TRINITY_R2_ACCESS_KEY_ID: ${{ secrets.TRINITY_R2_ACCESS_KEY_ID }}
          TRINITY_R2_SECRET_ACCESS_KEY: ${{ secrets.TRINITY_R2_SECRET_ACCESS_KEY }}
          TRINITY_R2_BUCKET: ${{ vars.TRINITY_R2_BUCKET || 'trinity-raw' }}
        shell: bash
        run: |
          args=(reconcile-official-r2
            --restore-root "$RUNNER_TEMP/trinity-restored-official"
            --store "$RUNNER_TEMP/trinity-prospective-ingestion.sqlite3")
          if [[ "$SOURCE_EVENT_NAME" == "workflow_run" ]]; then
            [[ "$SOURCE_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "Invalid source workflow run ID" >&2; exit 2;
            }
            [[ "$SOURCE_WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "Invalid source workflow run attempt" >&2; exit 2;
            }
            args+=(--github-run-id "$SOURCE_WORKFLOW_RUN_ID"
              --github-run-attempt "$SOURCE_WORKFLOW_RUN_ATTEMPT"
              --allow-no-official-cycle)
          elif [[ "$SOURCE_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$MANUAL_OFFICIAL_RUN_ID" =~ ^SHADOW_USA_[0-9]{4}-[0-9]{2}-[0-9]{2}_[1-9][0-9]*_A[1-9][0-9]*$ ]] || {
              echo "Invalid archived OFFICIAL run identity" >&2; exit 2;
            }
            args+=(--run-id "$MANUAL_OFFICIAL_RUN_ID")
          else
            echo "Unsupported reconciliation event" >&2
            exit 2
          fi
          python .workflow-registration/.github/scripts/trinity_p3_automatic_outcomes.py "${args[@]}"
      - name: Preserve reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trinity-official-feedback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trinity-restored-official
          if-no-files-found: ignore
          retention-days: 30
