name: TRINITY Telegram Connectivity Test (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-connectivity:
    name: Isolated Telegram connectivity probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Python 3.13.15
        # actions/setup-python v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"

      - name: Install isolated connectivity dependency
        run: python -m pip install --disable-pip-version-check requests==2.34.2

      - name: Probe getMe and send one harmless message
        env:
          TRINITY_TELEGRAM_BOT_TOKEN: ${{ secrets.TRINITY_TELEGRAM_BOT_TOKEN }}
          TRINITY_TELEGRAM_CHAT_ID: ${{ secrets.TRINITY_TELEGRAM_CHAT_ID }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import sys

          import requests

          token = os.environ.get("TRINITY_TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TRINITY_TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Telegram repository secrets are missing")

          result = {
              "getMe": {
                  "result": "NOT_RUN",
                  "http_status": None,
                  "ok": None,
                  "description": None,
                  "transport_exception_class": None,
              },
              "sendMessage": {
                  "result": "NOT_RUN",
                  "http_status": None,
                  "ok": None,
                  "description": None,
                  "transport_exception_class": None,
              },
              "message_sent": False,
          }

          def sanitized(value):
              text = str(value)[:500]
              for secret in (token, chat_id):
                  if secret:
                      text = text.replace(secret, "[REDACTED]")
              return text

          def request(stage, method, *, json_body=None):
              record = result[stage]
              try:
                  url = "https://api.telegram.org/bot" + token + "/" + stage
                  response = requests.request(
                      method,
                      url,
                      json=json_body,
                      timeout=15,
                  )
                  record["http_status"] = response.status_code
                  try:
                      payload = response.json()
                  except ValueError:
                      payload = {}
                      record["description"] = "Telegram returned a non-JSON response"
                  record["ok"] = payload.get("ok") if isinstance(payload, dict) else None
                  if isinstance(payload, dict) and payload.get("description"):
                      record["description"] = sanitized(payload["description"])
                  if 200 <= response.status_code < 300 and record["ok"] is True:
                      record["result"] = "SUCCESS"
                      return True
                  record["result"] = "TELEGRAM_API_REJECTION"
                  return False
              except requests.RequestException as exc:
                  record["result"] = "TRANSPORT_FAILURE"
                  record["transport_exception_class"] = type(exc).__name__
                  return False

          get_me_ok = request("getMe", "GET")
          send_ok = False
          if get_me_ok:
              send_ok = request(
                  "sendMessage",
                  "POST",
                  json_body={
                      "chat_id": chat_id,
                      "text": "TRINITY Telegram GitHub Actions connectivity test",
                  },
              )
              result["message_sent"] = send_ok

          output = json.dumps(result, ensure_ascii=False, sort_keys=True)
          print("TELEGRAM_CONNECTIVITY_RESULT=" + output)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("## Telegram connectivity result\n\n```json\n" + output + "\n```\n")
          if not (get_me_ok and send_ok):
              sys.exit(1)
