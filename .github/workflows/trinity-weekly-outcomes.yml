name: TRINITY Weekly Prospective Outcomes

# P3 review branch only. GitHub scheduled workflows execute only from the
# default branch, so these triggers remain inactive until an explicit future
# promotion is reviewed and merged.
on:
  schedule:
    - cron: "0 4 * * 2"
    - cron: "0 5 * * 2"
    - cron: "0 4 * * 3"
    - cron: "0 5 * * 3"
    - cron: "0 4 * * 4"
    - cron: "0 5 * * 4"
    - cron: "0 4 * * 5"
    - cron: "0 5 * * 5"
    - cron: "0 4 * * 6"
    - cron: "0 5 * * 6"

permissions:
  contents: read

concurrency:
  group: trinity-prospective-outcomes-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TRINITY_ANALYTICAL_REF: eb15c45b041b8890194d2f98b025aa98ed7fa527

jobs:
  schedule-gate:
    name: Resolve next-morning frozen observation slot
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      iso_year: ${{ steps.gate.outputs.iso_year }}
      iso_week: ${{ steps.gate.outputs.iso_week }}
      target_market_session: ${{ steps.gate.outputs.target_market_session }}
      observation_slot_id: ${{ steps.gate.outputs.observation_slot_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TRINITY_ANALYTICAL_REF }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .workflow-registration
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-shadow.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-shadow.txt
      - id: gate
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          python .workflow-registration/.github/scripts/trinity_p3_outcome_schedule.py
          --event-schedule "$EVENT_SCHEDULE"
          --run-started-at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  collect-outcomes:
    name: Collect exact mature prospective outcomes
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TRINITY_ANALYTICAL_REF }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .workflow-registration
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-shadow.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-shadow.txt
      - name: Build the authoritative slot or report NO_MATURE_EXPECTATIONS
        env:
          TRINITY_R2_ENDPOINT: ${{ secrets.TRINITY_R2_ENDPOINT }}
          TRINITY_R2_ACCESS_KEY_ID: ${{ secrets.TRINITY_R2_ACCESS_KEY_ID }}
          TRINITY_R2_SECRET_ACCESS_KEY: ${{ secrets.TRINITY_R2_SECRET_ACCESS_KEY }}
          TRINITY_R2_BUCKET: ${{ vars.TRINITY_R2_BUCKET || 'trinity-raw' }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: >-
          python .workflow-registration/.github/scripts/trinity_p3_automatic_outcomes.py
          run-outcomes-r2
          --iso-year "${{ needs.schedule-gate.outputs.iso_year }}"
          --iso-week "${{ needs.schedule-gate.outputs.iso_week }}"
          --store "$RUNNER_TEMP/trinity-prospective.sqlite3"
          --work-root "$RUNNER_TEMP/trinity-prospective-outcomes"
      - name: Preserve non-authoritative diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trinity-prospective-outcomes-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trinity-prospective-outcomes
          if-no-files-found: ignore
          retention-days: 30
